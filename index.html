<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>発送連絡アシスタント | クリーンたっち</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#203332;background:#f3f6f5;line-height:1.7}*{box-sizing:border-box}body{margin:0}header{background:#173f38;color:white;padding:28px max(24px,calc((100vw - 1080px)/2))}header small{letter-spacing:.12em;color:#bcdad2}h1{font-size:26px;margin:6px 0}header p{margin:0;color:#dcebe6}main{max-width:1080px;margin:28px auto;padding:0 20px}.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:22px}.card{background:white;border:1px solid #dbe5e1;border-radius:16px;padding:26px;box-shadow:0 4px 20px #20333206}h2{font-size:19px;margin:0 0 18px}.field{margin-bottom:17px}label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid #aabdb6;border-radius:8px;background:white;color:inherit}textarea{resize:vertical;min-height:360px;font-size:15px}input:focus,select:focus,textarea:focus{outline:3px solid #c6e6dc;border-color:#28725e}button{font:inherit;font-weight:600;padding:11px 18px;border-radius:8px;border:1px solid #22614f;cursor:pointer;background:#22614f;color:white}button.secondary{background:white;color:#22614f}button:focus-visible{outline:3px solid #8bcbb5;outline-offset:3px}.actions{display:flex;gap:10px;flex-wrap:wrap}.hint{font-size:13px;color:#60746c;margin:6px 0}.error{color:#ab2938;white-space:pre-line}.status{min-height:27px;margin:10px 0 0;font-size:14px}footer{font-size:13px;color:#60746c;padding:22px 0}.badge{background:#edf5f1;padding:9px 12px;border-radius:8px;font-size:13px;margin-top:18px}[hidden]{display:none!important}@media(max-width:760px){.grid{grid-template-columns:1fr}header{padding:23px}h1{font-size:23px}.card{padding:20px}main{padding:0 14px;margin:18px auto}}
</style>
</head>
<body>
<header><small>CLEAN TOUCH / 発送業務</small><h1>発送連絡アシスタント</h1><p>必要事項を入力して、購入者への連絡文を作成します。</p></header>
<main><div class="grid"><section class="card"><h2>1. 連絡内容を入力</h2>
<form id="form" novalidate>
<div class="field"><label for="market">販路</label><select id="market"><option>ヤフオク</option><option>メルカリShops</option></select></div>
<div class="field"><label for="kind">連絡種別</label><select id="kind"><option value="shipped">発送済みの案内</option><option value="delay">発送遅延のお詫び</option><option value="correction">追跡番号の訂正</option></select></div>
<div class="field"><label for="carrier">運送会社（必須）</label><select id="carrier"><option value="">選択してください</option><option>佐川急便</option><option>ヤマト運輸</option><option>日本郵便</option><option value="other">その他</option></select><input id="otherCarrier" hidden aria-label="運送会社名" placeholder="運送会社名" style="margin-top:8px"></div>
<div class="field" id="dateField"><label for="date" id="dateLabel">発送日（必須）</label><input id="date" type="date" required></div>
<div class="field" id="changeField" hidden><label for="change">追跡番号の変更（必須）</label><select id="change"><option value="">選択してください</option><option value="same">変更なし</option><option value="changed">変更あり・新番号が確定</option><option value="pending">未確定・発送後に案内</option></select></div>
<div class="field" id="trackingField"><label for="tracking" id="trackingLabel">追跡番号（必須）</label><input id="tracking" type="text" autocomplete="off" placeholder="例：1234-5678-9012"><p class="hint">半角数字・ハイフン・空白で入力してください。</p></div>
<div class="field" id="reasonField" hidden><label for="reason">遅延理由（必須）</label><input id="reason" type="text" placeholder="例：運送会社の集荷漏れがあり、集荷されませんでした。"></div>
<div id="errors" class="error status" role="alert"></div>
<div class="actions"><button type="submit">連絡文を作成</button><button type="button" class="secondary" id="reset">入力をクリア</button></div>
</form></section>
<section class="card"><h2>2. 確認してコピー</h2><label for="output">連絡文（編集できます）</label><textarea id="output" placeholder="作成した文章がここに表示されます。"></textarea><p class="hint">日付・番号・内容を確認し、取引画面へ貼り付けてください。</p><button type="button" id="copy">文章をコピー</button><p id="status" class="status" role="status" aria-live="polite"></p><div class="badge">送信は取引画面で行ってください。入力内容は保存されません。</div></section>
</div><footer>株式会社クリーンたっち · 顧客の氏名・住所の入力は不要です。</footer></main>
<script>
const $=id=>document.getElementById(id);
function syncFields(){
 const kind=$('kind').value,delay=kind==='delay';
 $('dateField').hidden=kind==='correction';$('reasonField').hidden=!delay;$('changeField').hidden=!delay;
 $('dateLabel').textContent=delay?'発送予定日（必須）':'発送日（必須）';
 $('trackingField').hidden=delay&&$('change').value==='pending';
 $('trackingLabel').textContent=kind==='correction'||(delay&&$('change').value==='changed')?'正しい追跡番号（必須）':'追跡番号（必須）';
 $('otherCarrier').hidden=$('carrier').value!=='other';
 $('output').value='';$('status').textContent='';$('errors').textContent='';
}
function buildMessage(v){
 const errors=[];
 if(!v.carrier)errors.push('運送会社を入力してください。');
 if(v.kind!=='correction'&&!/^\d{4}-\d{2}-\d{2}$/.test(v.date))errors.push('有効な発送日・発送予定日を入力してください。');
 if(v.kind==='delay'&&!v.change)errors.push('追跡番号の変更有無を選択してください。');
 if(v.kind==='delay'&&!v.reason)errors.push('遅延理由を入力してください。');
 if(!(v.kind==='delay'&&v.change==='pending')&&!/^[0-9][0-9\s-]*$/.test(v.tracking))errors.push('追跡番号を半角数字で入力してください。');
 if(errors.length)return {errors};
 const greeting=v.market==='メルカリShops'?'この度はご購入いただき、ありがとうございます。':'この度はご落札いただき、ありがとうございます。';
 const date=v.date?`${Number(v.date.slice(0,4))}年${Number(v.date.slice(5,7))}月${Number(v.date.slice(8,10))}日`:'';
 const tracking=`運送会社：${v.carrier}\nお問い合わせ番号：${v.tracking}`;
 let body;
 if(v.kind==='shipped')body=`${date}に商品を発送いたしました。\n\n${tracking}\n\nお届けまで今しばらくお待ちくださいますようお願いいたします。`;
 else if(v.kind==='delay'){
  const change=v.change==='same'?`${tracking}\nお問い合わせ番号に変更はございません。`:v.change==='changed'?`お問い合わせ番号が変更となります。新しい番号は以下の通りです。\n${tracking}`:`運送会社：${v.carrier}\nお問い合わせ番号は、発送後に改めてご案内いたします。`;
  body=`発送が遅れており、大変申し訳ございません。\n\n遅延理由：${v.reason}\n${date}に発送する予定です。\n\n${change}\n\nお待たせしてしまい、申し訳ございません。`;
 }else body=`先にご案内したお問い合わせ番号に誤りがございました。\n正しい番号は以下の通りです。\n\n${tracking}\n\n誤ったご案内によりお手数をおかけし、大変申し訳ございません。`;
 return {text:`お世話になっております。\n${greeting}\n\n${body}\n\n何卒よろしくお願いいたします。`};
}
$('kind').addEventListener('change',syncFields);$('carrier').addEventListener('change',syncFields);$('change').addEventListener('change',syncFields);
$('form').addEventListener('input',()=>{$('output').value='';$('status').textContent='';$('errors').textContent='';});
$('form').addEventListener('submit',e=>{e.preventDefault();const v={};for(const id of ['market','kind','date','change','reason','tracking'])v[id]=$(id).value.trim();v.carrier=$('carrier').value==='other'?$('otherCarrier').value.trim():$('carrier').value;const result=buildMessage(v);$('errors').textContent=(result.errors||[]).join('\n');$('output').value=result.text||'';$('status').textContent=result.text?'連絡文を作成しました。内容をご確認ください。':'';});
$('reset').addEventListener('click',()=>{$('form').reset();syncFields();});
$('copy').addEventListener('click',async()=>{if(!$('output').value.trim()){$('status').textContent='先に連絡文を作成してください。';return;}try{await navigator.clipboard.writeText($('output').value);$('status').textContent='コピーしました。取引画面に貼り付けてください。';}catch{ $('output').focus();$('output').select();$('status').textContent='自動コピーできませんでした。選択した文章を右クリック、または Ctrl+C / ⌘C でコピーしてください。';}});
syncFields();
</script></body></html>
